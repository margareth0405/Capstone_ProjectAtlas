<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <title>ATLAS · Administrator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=20260807-library-sync-1" />
    <link rel="stylesheet" href="css/login.css?v=20260807-2" />
  </head>
  <body>
    <div
      class="toast-container position-fixed bottom-0 end-0 p-3"
      style="z-index: 9999"
    >
      <div
        id="liveToast"
        class="toast align-items-center text-white border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
        style="background: var(--maroon-800)"
      >
        <div class="d-flex">
          <div class="toast-body" id="toastMessage">
            <i class="fas fa-check-circle me-2" style="color: var(--gold)"></i>
            Action completed
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>

    <div id="adminLoginScreen" class="screen active">
      <div class="login-container">
        <div class="login-card">
          <div class="brand-icon administrator-icon">
            <i class="fas fa-user-shield"></i>
          </div>
          <h1>Administrator</h1>
          <p class="tagline">Archive Management Portal</p>
          <p class="sub">Only administrators may access this page.</p>

          <form
            id="administratorLogin"
            onsubmit="handleAdministratorLogin(event)"
          >
            <div class="form-group">
              <label for="administratorEmail">
                <i class="fas fa-envelope"></i> Email
              </label>
              <input
                type="email"
                id="administratorEmail"
                class="form-control"
                placeholder="admin@example.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="administratorPassword">
                <i class="fas fa-lock"></i> Password
              </label>
              <input
                type="password"
                id="administratorPassword"
                class="form-control"
                placeholder="Password"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" class="btn-login administrator-btn">
              Sign In <i class="fas fa-arrow-right"></i>
            </button>
          </form>
          <p class="admin-registration-policy">
            Administrator login: <strong>admin@atlas.edu</strong><br />
            Password: <strong>password123</strong>
          </p>
        </div>
      </div>
    </div>

    <div id="dashboard" class="screen hidden">
      <div id="dashboardContent"></div>
    </div>

    <button
      id="scrollTopBtn"
      class="scroll-top"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
    >
      <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/data.js?v=20260807-library-sync-1"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js?v=20260807-role-clear-1"></script>
    <script>
      loadLibraryData();

      let adminSessionValid = false;

      const authorizedAdministrator = getAuthorizedAdministratorSession();
      if (authorizedAdministrator) {
        currentUser = authorizedAdministrator;
        adminSessionValid = true;
      }

      const adminLoginScreen = document.getElementById("adminLoginScreen");
      const dashboard = document.getElementById("dashboard");

      if (adminSessionValid) {
        if (adminLoginScreen) {
          adminLoginScreen.classList.remove("active");
          adminLoginScreen.classList.add("hidden");
        }
        if (dashboard) {
          dashboard.classList.remove("hidden");
          dashboard.classList.add("active");
        }
        loadDashboard("administrator");
      } else {
        if (adminLoginScreen) {
          adminLoginScreen.classList.add("active");
          adminLoginScreen.classList.remove("hidden");
        }
        if (dashboard) {
          dashboard.classList.add("hidden");
          dashboard.classList.remove("active");
        }
      }
    </script>
  </body>
</html>
